<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可以和我一起约会嘛？</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>">
<style>
  :root{
    --pink:#f4728a;
    --pink-deep:#e85d78;
    --pink-soft:#fdeef1;
    --bg1:#fdf3f0;
    --bg2:#fbe7ec;
    --ink:#3d3538;
    --ink-soft:#8a7d81;
    --card:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;overflow:hidden;
  }
  /* 漂浮爱心背景 */
  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .hearts span{
    position:absolute;bottom:-40px;font-size:18px;color:rgba(244,114,138,.28);
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0);opacity:0}
    10%{opacity:1}
    100%{transform:translateY(-110vh) rotate(30deg);opacity:0}
  }

  .phone{
    position:relative;z-index:1;width:min(420px,92vw);height:min(760px,94vh);
    background:linear-gradient(175deg,#fff 0%,#fdf1f3 100%);
    border-radius:32px;box-shadow:0 24px 60px rgba(232,93,120,.18);
    overflow:hidden;display:flex;flex-direction:column;
  }

  /* 视图切换 */
  .view{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:36px 30px;gap:18px;
    opacity:0;transform:translateX(40px);pointer-events:none;
    transition:opacity .35s ease,transform .35s ease;
  }
  .view.active{opacity:1;transform:translateX(0);pointer-events:auto}
  .view.prev{transform:translateX(-40px)}

  .avatar{
    width:128px;height:128px;border-radius:50%;object-fit:cover;
    border:5px solid #fff;box-shadow:0 10px 28px rgba(232,93,120,.25);
  }
  .avatar.busy{animation:bounce 1.2s ease infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  h1{font-size:24px;font-weight:700;letter-spacing:.5px;text-align:center}
  .sub{font-size:14px;color:var(--ink-soft);text-align:center;line-height:1.9}

  .btn-row{display:flex;gap:16px;align-items:center;margin-top:8px}
  .btn{
    border:none;cursor:pointer;font-size:16px;font-weight:600;
    padding:13px 30px;border-radius:999px;transition:transform .15s ease,box-shadow .15s ease;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;
    box-shadow:0 10px 22px rgba(232,93,120,.35);
  }
  .btn-primary:hover{transform:translateY(-2px)}
  .btn-ghost{background:#f3eeee;color:var(--ink-soft)}
  .btn-ghost:hover{background:#ece3e5}

  .hint{font-size:12px;color:var(--ink-soft);min-height:18px}

  /* 选餐厅网格 */
  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;margin-top:6px;
  }
  .food{
    background:var(--card);border:2px solid #f3e6e9;border-radius:20px;
    padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;
    cursor:pointer;transition:all .18s ease;
  }
  .food .emoji{font-size:30px}
  .food .label{font-size:13px;color:var(--ink)}
  .food.selected{border-color:var(--pink);background:var(--pink-soft);box-shadow:0 8px 18px rgba(232,93,120,.18)}
  .food.selected .label{color:var(--pink-deep);font-weight:600}

  /* 日期 / 时间选择 */
  .panel{width:100%;display:flex;flex-direction:column;gap:12px}
  .panel-title{font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
  .opt-grid{display:grid;gap:12px;width:100%}
  .opt-grid.dates{grid-template-columns:repeat(4,1fr)}
  .opt-grid.times{grid-template-columns:repeat(3,1fr)}
  .opt{
    background:var(--card);border:2px solid #f3e6e9;border-radius:16px;
    padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;
    cursor:pointer;transition:all .18s ease;
  }
  .opt .main{font-size:14px;font-weight:600;color:var(--ink)}
  .opt .sub2{font-size:11px;color:var(--ink-soft)}
  .opt.selected{border-color:var(--pink);background:var(--pink-soft);box-shadow:0 8px 18px rgba(232,93,120,.18)}
  .opt.selected .main{color:var(--pink-deep)}

  /* 进度圆点 */
  .dots{position:absolute;bottom:26px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:2}
  .dots i{width:7px;height:7px;border-radius:50%;background:#e7d6da;transition:all .25s ease}
  .dots i.on{background:var(--pink);width:20px;border-radius:999px}

  /* 收尾页 · 邀请函卡片 */
  .big-heart{font-size:64px;animation:beat 1.1s ease infinite}
  @keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}60%{transform:scale(.95)}}
  .confetti{position:absolute;top:-10px;font-size:16px;animation:fall linear infinite;pointer-events:none}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

  .invite-card{
    width:100%;background:#fff;border-radius:24px;padding:26px 24px 20px;
    box-shadow:0 16px 36px rgba(232,93,120,.16);display:flex;flex-direction:column;gap:18px;
  }
  .invite-head{text-align:center}
  .invite-head .title{font-size:19px;font-weight:700}
  .invite-head .en{font-size:12px;color:var(--ink-soft);letter-spacing:1.5px;margin-top:4px}
  .invite-row{display:flex;align-items:center;gap:14px}
  .invite-row .icon{
    width:38px;height:38px;border-radius:12px;background:var(--pink-soft);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;
  }
  .invite-row .k{font-size:13px;color:var(--ink-soft)}
  .invite-row .v{font-size:16px;font-weight:700;color:var(--ink);margin-top:2px}
  .invite-foot{text-align:center;font-size:13px;color:var(--ink-soft)}
  .deco{position:absolute;inset:0;pointer-events:none;font-size:16px;opacity:.8}

  /* “no thanks” 逃跑按钮 */
  .dodge{position:relative}
</style>
</head>
<body>

<div class="hearts" id="hearts" aria-hidden="true"></div>

<main class="phone">

  <!-- 第1屏：邀约 -->
  <section class="view active" data-view="1">
    <img class="avatar" src="assets/dog.jpg" alt="小金毛">
    <h1>可以和我一起约会嘛？<span style="color:var(--pink)">💛</span></h1>
    <p class="sub">有一只小金毛<br>它攒了好久的勇气<br>想约你出去走走~ 汪！</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="yes1">好呀 💛</button>
      <button class="btn btn-ghost dodge" id="no1">no thanks</button>
    </div>
    <p class="hint" id="hint1"></p>
  </section>

  <!-- 第2屏：选餐厅 -->
  <section class="view" data-view="2">
    <h1>我们吃点什么？🍽️</h1>
    <p class="sub">挑一个今天的约会氛围~</p>
    <div class="grid" id="foodGrid"></div>
    <button class="btn btn-primary" id="confirmFood" style="margin-top:14px">💛 选好了，就去吃！</button>
  </section>

  <!-- 第3屏：选日期时间 -->
  <section class="view" data-view="3">
    <h1>所以…你什么时候有空？⏰</h1>
    <div class="panel">
      <div class="panel-title">📅 选一天</div>
      <div class="opt-grid dates" id="dateGrid"></div>
      <div class="panel-title" style="margin-top:4px">⏰ 几点见？</div>
      <div class="opt-grid times" id="timeGrid"></div>
    </div>
    <button class="btn btn-primary" id="confirmTime" style="margin-top:10px">💛 确定时间</button>
  </section>

  <!-- 第4屏：惊喜 -->
  <section class="view" data-view="4">
    <img class="avatar busy" src="assets/dog.jpg" alt="小金毛">
    <h1>等下，你真的愿意？！</h1>
    <p class="sub">我都已经准备好被你拒绝了…<br>汪？！真的吗真的吗！<br>我好开心好开心好开心 💛</p>
    <button class="btn btn-primary" id="yes3">好啦好啦，走吧~</button>
  </section>

  <!-- 第5屏：邀请函 -->
  <section class="view" data-view="5">
    <img class="avatar" src="assets/dog.jpg" alt="小金毛" style="width:104px;height:104px">
    <h1>💛 好耶！约会成啦！</h1>
    <p class="sub">真开心你没有拒绝~<br>我会准时来接你的！汪！</p>
    <div class="invite-card">
      <div class="invite-head">
        <div class="title">🐶 约会邀请函</div>
        <div class="en">Date Invitation</div>
      </div>
      <div class="invite-row">
        <div class="icon">📅</div>
        <div><div class="k">Date</div><div class="v" id="invDate"></div></div>
      </div>
      <div class="invite-row">
        <div class="icon">⏰</div>
        <div><div class="k">Time</div><div class="v" id="invTime"></div></div>
      </div>
      <div class="invite-row">
        <div class="icon">🍽️</div>
        <div><div class="k">Menu</div><div class="v" id="invMenu"></div></div>
      </div>
      <div class="invite-foot">带好胃口，我带好 💛</div>
    </div>
  </section>

  <div class="dots" id="dots">
    <i class="on"></i><i></i><i></i><i></i><i></i>
  </div>
</main>

<script>
const FOODS = [
  ["🍲","火锅"],["🍕","披萨"],["🍣","寿司"],
  ["🥩","烤肉"],["🥟","早茶"],["🍜","拉面"],
  ["🌶️","麻辣烫"],["🦐","小龙虾"],["🍢","烧烤"]
];

/* 日期选项：今天起自动算星期，视频示例为 7/22 周三 */
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
function dateLabel(offset){
  const d = new Date(); d.setDate(d.getDate()+offset);
  return `${d.getMonth()+1}/${d.getDate()} ${WEEK[d.getDay()]}`;
}
const DATES = [
  ["今天", dateLabel(0)],
  ["明天", dateLabel(1)],
  ["后天", dateLabel(2)],
  ["周末", "选个好日子"]
];
const TIMES = ["上午 10:00","中午 12:00","下午 14:00","下午茶 ☕","晚上 18:00","晚上 19:30"];

const views = [...document.querySelectorAll(".view")];
const dots = [...document.querySelectorAll(".dots i")];
let current = 0;
let picked = null;
let pickedDate = null, pickedTime = null;

function go(n){
  views.forEach((v,i)=>{
    v.classList.toggle("active", i===n);
    v.classList.toggle("prev", i<n);
  });
  dots.forEach((d,i)=>d.classList.toggle("on", i===n));
  current = n;
}

/* 餐厅网格渲染 */
const grid = document.getElementById("foodGrid");
FOODS.forEach(([emoji,label])=>{
  const el = document.createElement("div");
  el.className = "food";
  el.innerHTML = `<span class="emoji">${emoji}</span><span class="label">${label}</span>`;
  el.onclick = ()=>{
    grid.querySelectorAll(".food").forEach(f=>f.classList.remove("selected"));
    el.classList.add("selected");
    picked = label;
  };
  grid.appendChild(el);
});

/* 第1屏：yes / no 逃跑 */
document.getElementById("yes1").onclick = ()=>go(1);
const no1 = document.getElementById("no1");
const hint1 = document.getElementById("hint1");
const dodgeLines = ["再想想嘛~","你舍得拒绝我吗？","汪呜…别走呀","真的不再考虑一下？"];
let dodgeCount = 0;
no1.onmouseenter = ()=>{
  dodgeCount++;
  no1.style.position = "relative";
  const x = (Math.random()*120-60);
  const y = (Math.random()*60-30);
  no1.style.transform = `translate(${x}px,${y}px)`;
  if(dodgeCount<=dodgeLines.length) hint1.textContent = dodgeLines[dodgeCount-1];
};
no1.onclick = ()=>{ no1.style.transform=""; dodgeCount=0; };

/* 第2屏：确认餐厅 → 去选时间 */
document.getElementById("confirmFood").onclick = ()=>{
  if(!picked){ hint1.textContent="先挑一个想吃的吧~"; return; }
  hint1.textContent="";
  go(2);
};

/* 第3屏：日期 / 时间选项渲染 */
const dateGrid = document.getElementById("dateGrid");
DATES.forEach(([main,sub2])=>{
  const el=document.createElement("div");
  el.className="opt";
  el.innerHTML=`<span class="main">${main}</span><span class="sub2">${sub2}</span>`;
  el.onclick=()=>{
    dateGrid.querySelectorAll(".opt").forEach(o=>o.classList.remove("selected"));
    el.classList.add("selected"); pickedDate=main;
  };
  dateGrid.appendChild(el);
});
const timeGrid = document.getElementById("timeGrid");
TIMES.forEach(t=>{
  const el=document.createElement("div");
  el.className="opt";
  el.innerHTML=`<span class="main">${t}</span>`;
  el.onclick=()=>{
    timeGrid.querySelectorAll(".opt").forEach(o=>o.classList.remove("selected"));
    el.classList.add("selected"); pickedTime=t;
  };
  timeGrid.appendChild(el);
});

/* 第3屏：确认时间 → 惊喜页 */
document.getElementById("confirmTime").onclick = ()=>{
  if(!pickedDate || !pickedTime){ hint1.textContent="日期和时间都要选一下哦~"; return; }
  go(3);
};

/* 第4屏：进入邀请函 */
document.getElementById("yes3").onclick = ()=>{
  document.getElementById("invDate").textContent = pickedDate;
  document.getElementById("invTime").textContent = pickedTime;
  document.getElementById("invMenu").textContent = picked;
  go(4);
  startConfetti();
};

/* 漂浮爱心 */
const heartsBox = document.getElementById("hearts");
for(let i=0;i<14;i++){
  const s=document.createElement("span");
  s.textContent="❤";
  s.style.left=Math.random()*100+"%";
  s.style.animationDuration=(6+Math.random()*8)+"s";
  s.style.animationDelay=(-Math.random()*8)+"s";
  s.style.fontSize=(12+Math.random()*16)+"px";
  heartsBox.appendChild(s);
}

/* 收尾彩带 */
function startConfetti(){
  const phone=document.querySelector(".phone");
  const colors=["💛","💖","✨","🌸","🧡"];
  for(let i=0;i<30;i++){
    const c=document.createElement("span");
    c.className="confetti";
    c.textContent=colors[i%colors.length];
    c.style.left=Math.random()*100+"%";
    c.style.animationDuration=(2.5+Math.random()*2.5)+"s";
    c.style.animationDelay=(Math.random()*1.2)+"s";
    phone.appendChild(c);
    setTimeout(()=>c.remove(),6000);
  }
}
</script>
</body>
</html>
